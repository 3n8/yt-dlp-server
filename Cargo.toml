[package]
name = "yt-dlp-server"
version = "0.1.0"
edition = "2021"
description = "Web and REST interface for downloading videos with yt-dlp"
license = "MIT"
repository = "https://github.com/3n8/yt-dlp-server"

[dependencies]
axum = { version = "0.8", features = ["multipart", "form"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["fs", "cors", "trace"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
rusqlite = { version = "0.32", features = ["bundled"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
regex = "1"
futures = "0.3"
tokio-stream = "0.1"
mime_guess = "2"
thiserror = "2"
async-stream = "0.3"
urlencoding = "2"
serde_urlencoded = "0.7"
