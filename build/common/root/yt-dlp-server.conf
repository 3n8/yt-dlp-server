[program:yt-dlp-server]
command=/usr/local/bin/yt-dlp-server
directory=/
stdout_logfile=/config/yt-dlp-server.log
stderr_logfile=/config/yt-dlp-server.err.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
autostart=true
autorestart=true
priority=5
environment=HOME="/config",XDG_CONFIG_HOME="/config",XDG_CACHE_HOME="/config/cache",YTDLP_BIN="/config/bin/yt-dlp",YDL_CONFIG_PATH="/config",YDL_DEFAULT_CONFIG="/usr/lib/yt-dlp-server/default_config.yml",YDL_STATIC_DIR="/usr/lib/yt-dlp-server/static",PATH="/config/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
