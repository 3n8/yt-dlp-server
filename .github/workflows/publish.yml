name: Publish

on:
  push:
    branches: [master]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: false
          sbom: false
          tags: ghcr.io/3n8/yt-dlp-server:latest
          build-args: |
            YDLS_VERSION=${{ github.sha }}
            RELEASETAG=${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=https://github.com/3n8/yt-dlp-server
            org.opencontainers.image.title=yt-dlp-server
            org.opencontainers.image.description=Web and REST interface for yt-dlp
